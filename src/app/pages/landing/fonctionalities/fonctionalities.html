<section class="container features" id="features" aria-labelledby="features-title">
  <h2 id="features-title" class="sr-only">Fonctionnalités</h2>

  @for (feature of features; track feature.title) {
    <app-feature-card
      [icon]="feature.icon"
      [title]="feature.title"
      [description]="feature.description" />
  }
</section>
